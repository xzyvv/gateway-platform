# cargo-mutants 配置（变异测试）
#
# 目的：验证「测试真的能抓到错」而不是只验证「代码能跑」。
# 变异体（如把 `+` 改成 `-`、把 `<=` 改成 `<`、把常量改错）若被测试杀死（killed），
# 说明该行为已被断言锁住；存活（survived）则说明断言缺失。
#
# 范围收敛：只跑 queue / formula / 解码模块，避免全仓变异导致 CI 时长失控。
# 本地：cargo install cargo-mutants && cargo mutants -p gateway-core
# CI：.github/workflows/fuzz-mutation.yml 的 mutation job（定时/手动触发）
examine_globs = [
  # 队列：SQLite 存储、深度/容量、淘汰、WAL 与错误分类
  "gateway-core/src/queue/**",
  # 公式引擎：安全表达式求值
  "gateway-core/src/engine/formula.rs",
  "gateway-core/src/pipeline/vformula.rs",
  # 解码模块
  "gateway-core/src/south/protocol/common/decode.rs",
  "gateway-core/src/south/protocol/common/frame_extract.rs",
  "gateway-core/src/south/protocol/modbus/frames.rs",
  "gateway-core/src/south/protocol/dlt645/frames.rs",
  "gateway-core/src/south/protocol/bacnet_mstp/frames.rs",
]

# 测试代码本身不参与变异（mutants 也会跳过 #[cfg(test)]，这里显式排除目录级测试）
exclude_globs = [
  "gateway-core/src/**/tests.rs",
  "gateway-core/src/**/tests/**",
]

# 排除 key.rs 里两个 cfg 变体函数的函数体（各 7 条变异体）：
#   key.rs:45:5 -> #[cfg(feature = "encryption")] fn ensure_key 的函数体
#   key.rs:51:5 -> #[cfg(not(feature = "encryption"))] fn ensure_key 的函数体
#
# 为什么 45:5 必须排除：主 job 不开 encryption，这个函数根本不参与编译，
# 变异后编译产物逐字节相同 -> 测试照过 -> 判定为「漏网」，但它其实测不到。
# 这 7 条改由 .cargo/mutants-encryption.toml 的窄 job 负责（那边带 encryption
# 编译，分支真实存在，且 key.rs 里有对应的 hex 断言）。
#
# 为什么 51:5 也排除：默认分支的 ensure_key 恒返回空串，这个值唯一的去处是
# `PRAGMA key = <值>`，而未链接 SQLCipher 的 SQLite 会直接忽略未知 pragma
# （不是错误）——把它改成任意非空串，在默认构建里都**没有任何可观测差异**，
# 这些变异体本质上无法被任何断言区分。与其把它们写成「存量漏网」污染基线，
# 不如明确划出变异范围。
#
# 注意这里**没有**排除整个 key.rs 文件：key.rs 里其余逻辑（路径推导、
# 长度校验、安全落盘、权限收紧、hex 编码）是无条件编译的，在默认构建里
# 真实生效且有断言，必须留在主 job 的变异范围内。
#
# 行号会随 key.rs 上方增删行而漂移：改动 key.rs 前 51 行时必须同步更新
# 这里与窄配置，否则会出现「某个分支一个变异体都没跑到」的静默 coverage 丢失。
#
# 第三条 db_init\\.rs:342:8: 是 storage/sqlite/db_init.rs 里 open_with_key 的
# `if !key_hex.is_empty()` 的否定号删除变异：
#   · 主 job 不开 encryption -> key_hex 恒为空串 -> 原逻辑「不设 PRAGMA key」，
#     变异后变成「设 PRAGMA key = ''」；未链接 SQLCipher 的 SQLite 会忽略未知
#     pragma（不是错误），于是两种行为**完全不可区分**，属于假存活。
#   · 窄 job 带 encryption 编译 -> key_hex 非空 -> 变异后不再执行 PRAGMA key，
#     密文库打不开，行为差异可被断言抓住。
# 所以把它交给窄 job（见 .cargo/mutants-encryption.toml）。
#
# 第四条 key\\.rs:134:5: 是 to_hex 的返回值变异（2 条）：
#   to_hex 只被 #[cfg(feature = "encryption")] 的 ensure_key 调用，主 job 不开
#   encryption -> 该函数在默认构建里从未被调用 -> 变异后没有任何可观察差异，
#   属于「行为不可观察」的假存活。带 encryption 编译时它才真正生效，
#   由窄 job 独占（见 .cargo/mutants-encryption.toml）。
#
# 下面数组第 5 条起是**变体级**排除：同一行上的多个变体要逐条判定，
# 只有真正等价的才排除，其余仍留在变异范围内（真出现漏网时写进
# scripts/mutation_baseline.txt 当作真实覆盖缺口）。
#
# cargo-mutants 的 exclude_re 匹配的是**完整变体名**
# （形如 gateway-core/src/queue/core/key.rs:45:5: replace ... in 函数名），
# 所以可以把「行:列 + 变异描述」一起写进正则。每一条都满足「该变体与原代码
# 在所有可达输入下行为完全一致（含返回值、落库结果、指标值与日志输出）」。
#
# 判定依据逐条如下（行尾注释为等价原因）：
exclude_re = [
  "key\\.rs:45:5:",
  "key\\.rs:51:5:",
  "db_init\\.rs:342:8:",
  "key\\.rs:134:5:",
  # 公式引擎
  "vformula\\.rs:128:41: replace \\+ with \\*",   # lex 的 start+1 → start*1：切出的 inner 多带一个 '{'，
                                                  # 但 normalize_ref 会 trim_start_matches('{')，结果相同
  "vformula\\.rs:282:9: replace Parser<'a>::ensure_progress",
                                                  # ensure_progress 的守卫不可达：两处调用点（parse_expr/parse_term）
                                                  # 在调用前都已 self.pos += 1，pos 必然前进
  "vformula\\.rs:321:30: replace \\+= with \\*=", # parse_expr 的 pos += 1 → pos *= 1：同一个 '+' 改由
                                                  # parse_factor 的一元正号分支消费，AST 与报错路径都相同
  # 队列：SQLite 存储
  "migrate\\.rs:60:13: replace < with <=",       # migrate_schema 里 from == SCHEMA_VERSION 已提前返回，
                                                  # 走到这一行时 from != 4，from<=4 与 from<4 等价
  "limit\\.rs:260:74: replace > with >=",        # total>0 → total>=0：total==0 时 ratio 恒为 0.0，
                                                  # 两种写法判出的 unsent_overflow 相同
  "limit\\.rs:353:70: replace > with >=",        # 同上（淘汰路径）
  "limit\\.rs:796:24: replace > with >=",        # cleanup_old_records：undelivered==0 时
                                                  # saturating_dec(counter, 0) 是空操作
  "sqlite_storage\\.rs:146:29: replace > with >=", # released==0 时 saturating_dec(counter, 0) 是空操作
  "sqlite_storage\\.rs:208:30: replace > with >=", # refresh_unsent_overflow：total==0 时 ratio 恒为 0.0
  "sqlite_storage\\.rs:270:21: replace > with >=", # inserted==0 时两次 fetch_add(0) 是空操作
  "sqlite_storage\\.rs:310:43: replace > with >=", # undelivered_deleted==0 时 saturating_dec(counter, 0) 空操作
  "sqlite_storage\\.rs:363:23: replace > with >=", # superseded==0 时计数与指标增量都是 0，空操作
  "sqlite_storage\\.rs:427:21: replace > with >=", # released==0 时 update_in_flight_metric 重写同一个值
  "maintenance\\.rs:132:43: replace > with >=",  # 同 saturating_dec 空操作 + 指标重写同一个值
  "maintenance\\.rs:136:31: replace > with >=",  # 计数与指标增量都是 0，空操作
  "mod\\.rs:387:24: replace > with >=",          # flush_fallback：dropped==0 时 fetch_add(0) 是空操作
  "mod\\.rs:446:28: replace > with >=",          # flush_fallback_sync：同上
  # 解码与组帧
  "decode\\.rs:161:24: replace < with <=",       # encode_value_by_type：bytes.len()==out_len 时
                                                  # resize 到同长度是空操作
  "decode\\.rs:321:30: replace \\| with \\^",    # parse_bcd_address：高/低半字节位域不重叠
  "frame_extract\\.rs:161:22: replace > with >=", # start==0 时 fb.pop(0) 是空操作
  "frame_extract\\.rs:185:22: replace > with >=", # 同上
  "frame_extract\\.rs:208:18: replace > with >=", # 同上
  "frames\\.rs:145:30: replace \\| with \\^",    # dlt645 parse_data_id：高/低半字节位域不重叠
  "frames\\.rs:101:27: replace \\| with \\^",    # modbus parse_read_response：fc 恒 < 0x80
                                                  # （配置白名单只允许 1/2/3/4/5/6/15/16）
  "frames\\.rs:129:46: replace \\| with \\^",    # modbus：CRC 高/低字节位域不重叠
  "frames\\.rs:137:29: replace \\| with \\^",    # modbus：寄存器高/低字节位域不重叠
  "frames\\.rs:158:27: replace \\| with \\^",    # modbus parse_coils_response：同上 fc 恒 < 0x80
  "frames\\.rs:187:46: replace \\| with \\^",    # modbus：CRC 高/低字节位域不重叠
  "frames\\.rs:230:42: replace \\| with \\^",    # modbus extract_modbus_frame：CRC 位域不重叠
  "frames\\.rs:241:30: replace < with <=",       # modbus：上一行已保证 buf.len()>=5，这里的长度检查是死代码
  "frames\\.rs:241:30: replace < with ==",
  "frames\\.rs:286:45: replace \\| with \\^",    # modbus：CRC 高/低字节位域不重叠
  "frames\\.rs:132:39: replace \\| with \\^",    # bacnet parse_mstp_frame：CRC 位域不重叠
  "frames\\.rs:199:43: replace \\| with \\^",    # bacnet extract_mstp_frame：CRC 位域不重叠
]

# 每个变异体只跑「能覆盖这些模块」的测试目标：
#   --lib                                 队列/公式/解码的单元测试都在这里
#   --test power_loss                     队列断电一致性（崩溃恢复路径）
#   --test virtual_point_pipeline         虚拟点公式链路
#   --features bacnet-mstp                MSTP 不在默认 all-protocols 集合里，
#                                          不开这个 feature 时 bacnet_mstp 根本不编译，
#                                          该文件的变异体会全部「假存活」
# 刻意不跑 chaos / load / soak / north_*：逐变异体执行会把 CI 时长拉爆，
# 且它们覆盖的代码不在本配置的变异范围内。
#
# 为什么这里不开 encryption：
#   开了 encryption 就等于用 SQLCipher 打开数据库，于是
#   queue/storage/sqlite/consistency_tests.rs 整个文件
#   （#![cfg(not(feature = "encryption"))]）都不参与编译——
#   sqlite 存储的变异体就此失去断言保护，实测多出 15 条「假存活」。
#   加密分支的覆盖改由 .cargo/mutants-encryption.toml 的窄 job 单独负责：
#   它只变异 queue/core/key.rs，既让 encryption 分支真正参与变异并被断言覆盖，
#   又不牺牲 sqlite 存储的一致性断言。
additional_cargo_test_args = [
  "-p",
  "gateway-core",
  "--lib",
  "--test",
  "power_loss",
  "--test",
  "virtual_point_pipeline",
  "--features",
  "bacnet-mstp",
]
timeout_multiplier = 3.0
# 单位：秒（此字段要求数值，不接受 "60s" 这类字符串）
minimum_test_timeout = 60.0

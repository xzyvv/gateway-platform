[workspace]
members = ["gateway-core", "gateway-api", "gatewayd", "gateway-desktop/src-tauri", "tools/license-issuer"]
resolver = "2"
# cargo-fuzz 工程自带 [workspace]，不并入主工作区（避免 nightly/libFuzzer 依赖污染常规构建）
exclude = ["fuzz"]

# 默认成员不含 gateway-desktop（2026-11 起桌面端已冻结，不再构建/打包/发布）。
# 原因：Tauri 在 Linux 上编译需要 libwebkit2gtk / libgtk-3 等系统开发包，
# 而 Linux CI（check / bench / 交付冒烟）全部是交付链路的地基，不该被一个
# 已冻结的调试端拖住。目录与代码仍保留在 workspace members 里（防历史分支
# 合并丢文件），需要时用 `cargo check -p gateway-desktop` 在本地单独编译。
default-members = [
  "gateway-core",
  "gateway-api",
  "gatewayd",
  "tools/license-issuer",
]

# 统一包元信息，子 crate 用 version.workspace = true / edition.workspace = true 引用
[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["XingZhiYuan"]
license = "Apache-2.0"
repository = "https://github.com/xzyvv/gateway-platform"
# 本项目以源码形式分发，不发布到 crates.io registry；cargo-deny 据此跳过这些 crate 的许可证检查
publish = false

# 统一依赖版本，子 crate 用 { workspace = true } 引用，升级时只改一处。
# optional 特性仍由子 crate 自行声明（workspace.dependencies 中不写 optional）。
[workspace.dependencies]
# ===== 基础运行时（gateway-core / desktop 共享）=====
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
# opt-3: stream 统一声明。原 desktop 单独加 stream 会因 Cargo feature
# unification 泄漏给 gateway-core（core 不用 bytes_stream 也会编译进 stream）。
# 统一声明消除 sibling 风险，开销小（core 本就依赖 futures）。
reqwest = { version = "0.12", features = ["json", "rustls-tls", "stream"], default-features = false }

# ===== gateway-core 专用 =====
parking_lot = "0.13"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
tracing-subscriber = { version = "0.3", features = ["json", "env-filter", "fmt"] }
tracing-appender = "0.2"
axum = { version = "0.7", features = ["ws", "macros"] }
tower = { version = "0.4", features = ["limit", "util"] }
tower-http = { version = "0.5", features = ["compression-gzip", "catch-panic", "cors", "fs", "trace"] }
once_cell = "1"
rumqttc = { version = "0.25", features = ["use-rustls", "websocket"] }
ring = "0.17"
# 默认使用标准 SQLite（开发机无 OpenSSL/Perl）
# 生产构建启用加密：cargo build -p gateway-core --features encryption
# （workspace 根不支持 `--features gateway-core/encryption` 写法；构建 gatewayd 时用 -p gatewayd）
# 0.42 起 libsqlite3-sys 升到 0.40，bundled-sqlcipher 路径跟随
# sqlcipher-src 420.0.0（SQLite 3.54.1），闭合 RUSTSEC-2026-0502
# （C SQLite CVE-2026-119375，修复版本 SQLite 3.54.0）。
rusqlite = { version = "0.42", features = ["bundled"] }
tokio-serial = "5"
rsntp = "3"
thiserror = "1"
evalexpr = "11"
validator = { version = "0.21", features = ["derive"] }
flate2 = "1.0"
# OTA 差分升级：bsdiff 4.x 兼容的补丁应用（纯 Rust，无 C/交叉编译负担）
qbsdiff = { version = "1.4", default-features = false }
libc = "0.2"
# OPC UA：子特性 server / client 由 gateway-core 的 feature 决定
# （opcua-server / opcua-client），此处不要写死 features —— 一旦在 workspace
# 声明，所有引用方都会无条件打开 server+client，协议裁剪直接失效。
async-opcua = { version = "0.19" }
rcgen = "0.13"
pem = "3"
# S4: 加载系统 CA 证书（mTLS 场景下避免 ca 为空导致验证失败）
rustls-native-certs = "0.6"
x509-parser = "0.16"
arc-swap = "1"
ts-rs = { version = "10", features = ["chrono-impl", "no-serde-warnings"] }
# 配置 JSON Schema：schemars 从 struct 派生 schema，jsonschema 加载时校验
schemars = "1"
jsonschema = "0.58"
# C-1: 敏感内存零化（crypto/secret.rs）。hand-written `for *b = 0` 会被 LLVM
# release profile 当作 dead store 优化掉；zeroize crate 用 volatile write + fence
# 真正保证清除。
zeroize = "1"
# feature-gated 依赖（optional 在子 crate 声明）
gpiod = "0.2"
# feature-gated：OTLP 远程 trace 导出（tracing-otlp 启用时；版本与 tracing-opentelemetry 对齐需 cargo check 验证）
opentelemetry = "0.28"
opentelemetry-otlp = { version = "0.28", features = ["grpc-tonic"] }
tracing-opentelemetry = "0.29"
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio"] }
# 基准测试：cargo bench --workspace（criterion 输出统计 + HTML 报告）
criterion = { version = "0.5", features = ["html_reports"] }

# ===== Windows 平台 API =====
# 网卡枚举（GetAdaptersAddresses / GetIfTable2）需要 struct 布局与系统 ABI 严格一致，
# 手写 repr(C) 的 IP_ADAPTER_ADDRESSES_LH 极易错位，故使用官方 sys crate。
# 版本与 tauri(tao/wry) 传递引入的 0.61.2 对齐，避免同一 crate 多版本重复编译。
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
] }

# ===== desktop 专用 =====
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"
tauri-build = { version = "2", features = [] }
dirs = "5"

# ===== dev-dependencies =====
rand = "0.8"
async-trait = "0.1"
tempfile = "3"

# dev profile 控制调试符号。
# cargo 默认 dev profile 的 debug=true 会为每个 crate 生成完整 PDB，
# target/debug/deps 下的 .pdb 曾累计到 24 GB，增量缓存更是膨胀到 58 GB。
# debug="line-tables-only" 只保留行号表：panic 回溯仍能定位到源码行，
# 但不再携带完整调试信息，体积下降一个数量级。
[profile.dev]
debug = "line-tables-only"

# 第三方依赖不参与断点调试，不需要调试符号，全部去掉。
[profile.dev.package."*"]
debug = 0

# build-override 覆盖 build script 与 proc-macro 的编译产物。
# 过程宏每次编译都要生成 PDB（serde_derive、thiserror_impl 等），
# 单独关闭后可省下约 1 GB。
[profile.dev.build-override]
debug = 0

# 统一编译 profile，减小 release 二进制体积
[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
# A10: panic=unwind 让 catch_unwind / spawn_catch_unwind 重新生效。
# panic=abort 模式下 spawn_catch_unwind 无法捕获 panic，后台任务 panic 直接终止整个进程，
# desktop 端 panic 会无错误对话框退出。改成 unwind 牺牲约 5-10% 体积换取稳定性。
panic = "unwind"
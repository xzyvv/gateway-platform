name: fuzz-mutation

# ── 变异测试 + 模糊测试（重作业，不阻塞常规 CI）──
# 这两类测试的共同点是「时长不可控」：
#   · cargo-mutants：每个变异体都要完整跑一遍 gateway-core 测试；
#   · libFuzzer：按时间预算跑，时间越长覆盖越深。
# 因此单独成流，只由「定时 + 手动」触发，不挂到 ci.yml / release-gate 上。
#
# 本地等价命令：
#   cargo install cargo-mutants && cargo mutants -p gateway-core
#   cargo +nightly install cargo-fuzz && cargo +nightly fuzz run modbus_decode
#
# 分工说明：
#   · 变异测试回答「测试能不能抓到错」（运算符反转、边界 `<`/`<=`、分支删除等）；
#     注意：cargo-mutants 不生成 const 变异体，「帧类型常量写错」这类问题要靠
#     golden 报文与字面量断言（bacnet_mstp/tests.rs）兜底；
#   · fuzz 回答「畸形输入会不会 panic / 越界 / 死循环」，抓不到语义错误。

on:
  schedule:
    # 每周一 02:00（Asia/Shanghai，UTC 周日 18:00）
    - cron: "0 18 * * 0"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  mutation:
    name: mutation (queue/formula/decode) shard ${{ matrix.idx }}/16
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        # cargo-mutants 的 --shard k/n 中 k 是 0-based 且要求 k < n，
        # 所以 shard 必须是 0..15。展示用的 1-based 序号单独用 idx 带出：
        # GitHub Actions 表达式只有比较/逻辑运算符，没有加法，
        # 写 ${{ matrix.shard + 1 }} 会让整个工作流文件解析失败。
        #
        # 分片数为什么是 16：全量 1634 个变异体，实测单个变异体约 81s
        # （cargo test --no-run 编译 40s + 跑测试 43s），
        #   8 路 -> 每片 204 个 -> 约 274 分钟，贴着 300 分钟上限，
        #           上一轮 8 路实测有 4 片被 runner 取消在 140~217 分钟；
        #  16 路 -> 每片约 102 个 -> 约 138 分钟，留出一倍以上的抖动余量。
        include:
          - { shard: 0, idx: 1 }
          - { shard: 1, idx: 2 }
          - { shard: 2, idx: 3 }
          - { shard: 3, idx: 4 }
          - { shard: 4, idx: 5 }
          - { shard: 5, idx:  6 }
          - { shard: 6, idx: 7 }
          - { shard: 7, idx:  8 }
          - { shard: 8, idx: 9 }
          - { shard: 9, idx: 10 }
          - { shard: 10, idx: 11 }
          - { shard: 11, idx: 12 }
          - { shard: 12, idx: 13 }
          - { shard: 13, idx: 14 }
          - { shard: 14, idx: 15 }
          - { shard: 15, idx: 16 }
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install cargo-mutants
        uses: taiki-e/install-action@cargo-mutants

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-mutants-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-mutants-

      - name: cargo mutants
        # 变异范围由仓库根的 .cargo/mutants.toml 收敛到 queue / formula / 解码模块。
        # --in-place：直接在工作树内变异，省掉每个变异体复制整个 workspace 的开销；
        # CI 是一次性环境，不存在污染工作区的风险。
        # --shard 的分母必须与上面的 matrix 长度一致（16 路并行）：cargo-mutants
        # 要求 k < n，写成 /8 时 shard 8~15 会直接报 "shard k must be less than n"
        # 而一个变异体都没跑，白白烧掉 8 个 runner。
        #
        # 这里不用 cargo-mutants 自己的退出码当门禁：只要还有一条存活变异体，
        # 它就返回非零码（FoundProblems），在补齐断言之前这条工作流永远是红的。
        # 真正的判定交给下面的 scripts/mutation_gate.py：
        #   · 超时变异体 / 分片没跑完 / 新增漏网 -> 拦下；
        #   · 已登记在基线里的存量漏网 -> 只报告。
        # 所以这一步即便非零退出也要继续跑，产物先上传、门禁照常判定。
        id: mutants
        continue-on-error: true
        run: cargo mutants -p gateway-core --in-place --shard ${{ matrix.shard }}/16
        env:
          RUSTFLAGS: ""
          CARGO_INCREMENTAL: "0"

      - name: mutation gate
        # 门禁判定：见 scripts/mutation_gate.py 的说明。
        # 存量漏网登记在 scripts/mutation_baseline.txt，与行数预算一个口径：
        # 存量只减不增，新增漏网立刻拦下。
        run: python3 scripts/mutation_gate.py --out mutants.out --baseline scripts/mutation_baseline.txt

      - name: Upload mutants report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutants-out-shard-${{ matrix.idx }}
          path: mutants.out
          if-no-files-found: ignore

  fuzz:
    name: fuzz ${{ matrix.target }} (60s)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        target: [modbus_decode, dlt645_decode, bacnet_mstp_decode]
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Install cargo-fuzz
        # 必须走 @v2 + with: tool:，不能用 @cargo-fuzz：
        # 后者解析到的是 install-action 仓库的顶层 cargo-fuzz 分支，那份 main.sh
        # 依赖「ref 名即工具名」的推断，而分支 ref 传不进 INPUT_TOOL，
        # 结果 tool 为空 → 什么也没装 → `cargo fuzz` 报 no such command。
        # @v2 + tool: 与 security.yml 装 cargo-audit / cargo-deny 的写法一致。
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz

      - name: Fuzz ${{ matrix.target }}
        # 单目标 60s 冒烟预算；crash / OOM / 超时都会以非零码退出。
        # 想跑得更深：本地去掉 -max_total_time 或调大该值。
        #
        # --target x86_64-unknown-linux-gnu 必须显式给：
        # cargo-fuzz 的 Linux 发行包只有 musl 一个产物，而它的默认目标三元组
        # 取自编译 cargo-fuzz 自身的平台（current_platform::CURRENT_PLATFORM），
        # 于是不传就会用 x86_64-unknown-linux-musl 去编译被测目标，带来两个硬错：
        #   1) E0463 can't find crate for `core`：nightly 工具链没装 musl 目标的 std；
        #   2) sanitizer is incompatible with statically linked libc：musl 默认静态链接，
        #      与 AddressSanitizer 互斥。
        # 换成宿主三元组（gnu 动态链接）两个问题一起消失。
        run: cargo +nightly fuzz run --target x86_64-unknown-linux-gnu ${{ matrix.target }} -- -max_total_time=60 -rss_limit_mb=2048

      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
          if-no-files-found: ignore

name: security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一 02:00 UTC 定期扫描（RustSec 公告库持续更新）
    - cron: "0 2 * * 1"
  workflow_dispatch:

# 同一个 ref 只保留最新一次运行（同 ci.yml 的取舍）
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# ── runner 版本：显式钉住 ubuntu-24.04，不用 ubuntu-latest ──
# GitHub 从 2026-10-19 起把 ubuntu-latest 迁到 Ubuntu 26.04：2026-11-11 的
# security run 已经实际跑在镜像 ubuntu-26.04/20261101.186 上，每个 job 都会带
# 一条 notice「The ubuntu-latest label will migrate to Ubuntu 26...」。
# 本工作流只做依赖审计 —— cargo-audit / cargo-deny 走 taiki-e 的预编译静态
# 二进制，npm audit 只读 package-lock，完全不耦合宿主发行版的系统库与工具链，
# 版本差异对结论零影响。显式钉住的理由：
#   · 去掉每次运行都刷的迁移提示（告警疲劳会让真正的告警被忽略）；
#   · 审计结论不随 GitHub 单方面滚动镜像而漂移，可复现；
#   · 升级时机由我们决定 —— 镜像退役时会直接报「找不到 runner」，
#     而不是悄悄换掉运行环境。
# 需要换版本时只改下面三处 runs-on；heavy.yml 的 ARM64 原生装机验证同样
# 用的是显式版本（ubuntu-24.04-arm）。
jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: cargo audit
        run: cargo audit --deny warnings

  cargo-deny:
    name: cargo deny (licenses / bans / sources)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: cargo deny check (advisories + licenses + bans + sources)
        run: cargo deny check

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与 ci.yml 一致：vite 8 / vitest 5 要求 node ≥ 22.12
          node-version: '22'

      - name: Install frontend deps
        run: |
          cd gateway-web
          npm ci

      - name: npm audit (production deps)
        run: |
          cd gateway-web
          # 仅审计生产依赖，dev 依赖漏洞仅警告不阻断
          npm audit --omit=dev --audit-level=high || {
            echo "::warning::npm audit found vulnerabilities in production dependencies"
            exit 1
          }

name: security

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一 02:00 UTC 定期扫描（RustSec 公告库持续更新）
    - cron: "0 2 * * 1"
  workflow_dispatch:

# 同一个 ref 只保留最新一次运行（同 ci.yml 的取舍）
concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

# ── runner 版本：全仓统一显式钉住 ubuntu-26.04，不用 ubuntu-latest ──
# GitHub 自 2026-10-19 起把 ubuntu-latest 迁到 Ubuntu 26.04，我们所有 job 从
# 2026-11-01 的镜像 ubuntu26/20261101.186 起就已经跑在 26.04 上了，因此每个
# 用 ubuntu-latest 的 job 都会带一条 notice
#   The ubuntu-latest label will migrate to Ubuntu 26 beginning October 19, 2026.
#
# 先验证再钉版本（不是顺手一起改）：heavy 全套在 26.04 上已经全绿（run
# 43015859884，13/13），其中对宿主镜像最敏感的两个也实测通过 ——
#   · release package (arm64 musl)
#   · static musl (x86_64 / armv7)
# 日志里 Runner Image 均为 ubuntu-26.04；security 三个审计 job 同样在 26.04 上
# 通过。所以钉 26.04 是「保持现状」而不是换环境，无需再验证一轮。
#
# 钉住而不是继续用 latest 的理由：
#   · 去掉每次运行都刷的迁移提示，避免告警疲劳掩盖真正的告警；
#   · 运行环境不随 GitHub 单方面滚动镜像而漂移，审计/性能结论可复现；
#   · 升级时机由我们决定 —— 镜像退役会直接报「找不到 runner」，
#     而不是悄悄换掉环境。
# 26.04 是官方支持的标签（GitHub 文档已列出 ubuntu-24.04 / ubuntu-26.04）。
# 换版本时改全仓 workflows 的 runs-on；ARM64 原生装机验证用 ubuntu-24.04-arm。
jobs:
  cargo-audit:
    name: cargo audit (RustSec)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Install cargo-audit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: cargo audit
        run: cargo audit --deny warnings

  cargo-deny:
    name: cargo deny (licenses / bans / sources)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.120.0

      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: cargo deny check (advisories + licenses + bans + sources)
        run: cargo deny check

  npm-audit:
    name: npm audit (frontend deps)
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # 与 ci.yml 一致：vite 8 / vitest 5 要求 node ≥ 22.12
          node-version: '22'

      - name: Install frontend deps
        run: |
          cd gateway-web
          npm ci

      - name: npm audit (production deps)
        run: |
          cd gateway-web
          # 仅审计生产依赖，dev 依赖漏洞仅警告不阻断
          npm audit --omit=dev --audit-level=high || {
            echo "::warning::npm audit found vulnerabilities in production dependencies"
            exit 1
          }

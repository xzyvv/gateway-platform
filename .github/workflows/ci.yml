name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  # 支持手动触发完整 bench job（见 bench job 的 if 条件）
  workflow_dispatch:

# 同一个 ref 只保留最新一次运行：连推时自动取消旧运行，避免多份 check/e2e 并行抢 runner
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: check / clippy / fmt / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          # 移除 rsproxy 镜像配置，CI 直接使用 crates.io
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # N-12：五阶段门禁（fmt → check → clippy → test --lib → build）只在
      # `gateway-core/scripts/ci.sh` 维护一份，CI 直接调用，避免 workflow 内联
      # 副本与本地脚本逐步漂移。RUSTFLAGS 置空：脚本内的 clippy 自带 -D warnings；
      # 测试编译保持原有"不因警告阻断"的宽松口径。
      - name: Local gate (scripts/ci.sh)
        run: bash gateway-core/scripts/ci.sh
        env:
          RUSTFLAGS: ""

      # dead_code 严格门禁：禁止 #![allow(dead_code)] 掩盖未来回归
      # 一旦发现 dead_code 立即失败，强制开发者删除或显式 #[allow(dead_code)] + 注释
      - name: dead_code strict check
        run: cargo check --all-targets --all-features
        env:
          RUSTFLAGS: "-D dead_code"

      # R2: tracing-otlp 分支回归。
      # 此前 OTLP 相关代码只被 `cargo check --all-features` 编译、**从未被执行**：
      # `shutdown_logging()` 的 provider flush、`make_json_file_layer_with_span`、
      # `make_stderr_layer_with_span` 全部落在 `cfg(feature = "tracing-otlp")` /
      # `cfg(feature = "tracing")` 下，默认 feature 的 lib 测试完全绕开它们。
      # 此步让这些分支进入真实运行路径；未启用 encryption，无需 OPENSSL。
      - name: cargo test (unit, tracing-otlp)
        run: cargo test -p gateway-core --lib --quiet --features tracing-otlp
        env:
          RUSTFLAGS: ""

      # 时区矩阵：cron 调度、授权防回拨、点位质量判定都涉及"本地时间"。
      # CI runner 的 TZ 恒为 UTC，而工业网关出厂常常也是 UTC，
      # 客户却按北京时间理解"每天凌晨 2 点采集"——这类偏差只有换一档时区
      # 跑同一批用例才会暴露：若某条断言只在 UTC 下成立，
      # 说明实现偷偷依赖了运行环境时区。
      # 这里在同一台 runner 上换 TZ 重跑同一批用例，把"与运行环境时区无关"
      # 钉成契约。成本极低：用的是上一步已编译好的单测二进制，只重跑不重编。
      - name: Timezone matrix (UTC / Asia/Shanghai / America/New_York)
        run: |
          set -euo pipefail
          for tz in UTC Asia/Shanghai America/New_York; do
            echo "=== TZ=$tz ==="
            log="$(TZ="$tz" cargo test -p gateway-core --lib --quiet --features tracing-otlp -- \
                    support::cron:: license::clock:: engine::util::model:: \
                    south::scheduler::device_state:: 2>&1)"
            echo "$log"
            # 过滤条件失配时 cargo 报 "0 passed" 并返回 0，
            # 那会让这道门禁静默退化成空跑——显式卡住"至少跑了一个用例"。
            printf '%s' "$log" | grep -Eq 'test result: ok\. [1-9][0-9]* passed' || {
              echo "TZ=$tz 下一条用例都没跑到（过滤条件可能失配）" >&2
              exit 1
            }
            echo "TZ=$tz 通过"
          done
        env:
          RUSTFLAGS: ""

      # F1: 协议 feature 编译矩阵。
      # gateway-core 的每个协议（modbus/dlt645/cjt188/opcua/...）都挂在一组
      # 独立 feature 下，并已有 30+ 处 `#[cfg(feature = "...")]`。但 CI 历史上只
      # 跑 `default = ["all-protocols"]` 一组配置——意味着 `--no-default-features
      # --features <某个协议>` 这种裁剪构建路径**从未被编译过**，任何残留 `use`、
      # 类型假设错误都会在生产做轻量化部署时才暴露。本矩阵覆盖四条代表性路径：
      #   1) --no-default-features：仅零依赖，剥离所有协议
      #   2) --features modbus,dlt645：常见数据链路最小组合
      #   3) --features opcua / opcua-client / opcua-server：OPC UA 已按南向
      #      Client 与北向 Server 拆分（两者拉 async-opcua 的不同子 crate），
      #      三个组合各自验证——`opcua` 是合并别名，client / server 单独路径
      #      最容易漏挂 cfg（北向 server 模块、opcua_sink、chaos 的测试服务端）。
      #   4) --features bacnet,bacnet-mstp：BACnet IP+MSTP 双栈（含依赖关系）
      #   5) --features fins：FINS（退役观察）单独路径——它已移出默认发行集，
      #      注册表条目按 #[cfg(feature = "fins")] 门控；不带该 feature 的组合
      #      编译不到这条路径，门控一旦写错只有显式开启时才暴露。
      # 仅 `cargo check`，不重复 `cargo test --lib`，控制 CI 时长。
      #
      # RUSTFLAGS="-D dead_code"：裁剪构建最容易遗留死代码——只被 dlt645/cjt188
      # 使用的 frame_extract、只被 modbus/mc/s7comm/bacnet 使用的
      # clone_collector_error，在其它 feature 组合下就是无调用方的死符号。
      # 共享层已按调用方加 `#[cfg(any(feature = ...))]` 门控（照 asdu 先例），
      # 此处把该契约锁进 CI：任何人不补门控就删调用方，立刻编译失败。
      # 注：cargo 对 registry 依赖传 --cap-lints allow，故 -D 只作用于本仓 crate。
      # 反证闭环：删掉 common/mod.rs 上 frame_extract 的 cfg 门 → 路径 1/3/4
      # 报 dead_code error；删掉 clone_collector_error 的 cfg 门 → 路径 1 报错。
      #
      # `--all-targets`：把集成测试（tests/chaos、tests/load、tests/soak）也纳入
      # 裁剪构建的编译检查。此前矩阵只编译 lib，集成测试里对协议模块的
      # 无条件 import（如 `south::protocol::modbus::transaction`）在裁剪构建下
      # 直接 E0432/E0433 失败——这些测试二进制只有默认 features 才编译过。
      # 现在集成测试按协议 feature 门控（chaos 场景逐个 cfg，load/soak 农场
      # 整体 cfg），裁剪构建下相关场景被剥离，其余场景照常编译。
      - name: protocol feature matrix (cargo check --all-targets, -D dead_code)
        run: |
          set -euo pipefail
          cargo check -p gateway-core --all-targets --no-default-features --quiet
          cargo check -p gateway-core --all-targets --no-default-features --features modbus,dlt645 --quiet
          cargo check -p gateway-core --all-targets --no-default-features --features opcua --quiet
          cargo check -p gateway-core --all-targets --no-default-features --features opcua-client --quiet
          cargo check -p gateway-core --all-targets --no-default-features --features opcua-server --quiet
          cargo check -p gateway-core --all-targets --no-default-features --features bacnet,bacnet-mstp --quiet
          cargo check -p gateway-core --all-targets --no-default-features --features fins --quiet
        env:
          RUSTFLAGS: "-D dead_code"

      # SKU 发行矩阵：5 个行业 SKU 的聚合 feature 此前只在发版脚本里被用到，
      # CI 从未编译过 `--no-default-features --features sku-<name>` 路径。
      # SKU 表单一来源 = gateway-core/Cargo.toml 的 `sku-*` 定义；此处从该文件
      # 动态取清单，新增 SKU 自动纳入，无需再改 CI。
      # 选 `-p gatewayd`：它是实际发行入口，且已对 gateway-core / gateway-api
      # 关闭 default-features 并双转发每个 SKU，能覆盖三层转发是否一致。
      # RUSTFLAGS="-D dead_code"：裁剪构建最容易留下只被其它 SKU 使用的死符号。
      - name: SKU feature matrix (cargo check -p gatewayd, -D dead_code)
        run: |
          set -euo pipefail
          skus=$(awk -F'=' '/^sku-[a-z0-9-]+[[:space:]]*=/ { k=$1; gsub(/[[:space:]]/, "", k); sub(/^sku-/, "", k); print k }' gateway-core/Cargo.toml)
          echo "SKU matrix: $(echo $skus)"
          for sku in $skus; do
            echo "==> sku-$sku"
            cargo check -p gatewayd --all-targets --no-default-features --features "sku-$sku" --quiet
          done
        env:
          RUSTFLAGS: "-D dead_code"

      # S1: 集成/契约测试此前从未在 CI 执行（仅靠 --all-targets 编译检查），
      # 导致 api_contract（HTTP 契约）/ arch_deps（分层依赖守卫）/ license 等防线未上锁。
      # 此处纳入门禁；chaos 时序测试见下方独立的 chaos job（R1 后同为强制门禁）。
      #
      # 测试二进制清单**动态取自 tests/ 目录**，不再手工维护 --test 白名单：
      # 白名单的人工同步约定已经漏过一次（新增的 core_domains_api /
      # protocol_capability_routing 未被列入，直到 coverage 作业跑全量才暴露，
      # 问题被"连锁"推迟到流水线末端才发现）。动态取目录后，新增 tests/*.rs
      # 自动进入门禁，无需改 workflow。
      #
      # 排除项（各自有独立归属，不在此重复跑）：
      #   chaos → 独立的 chaos job（时序场景，独立计时与失败定位）
      #   load / soak → 压测农场，用例整体 #[ignore]，由 scripts/soak.ps1 驱动
      - name: cargo test (integration & contract)
        run: |
          set -euo pipefail
          # 引擎侧：除 chaos/load/soak 外的全部集成测试二进制
          # （arch_deps 分层守卫 / virtual_point_pipeline / north_single_delivery）
          core_tests=""
          for f in gateway-core/tests/*.rs; do
            name=$(basename "$f" .rs)
            case "$name" in chaos|load|soak) continue ;; esac
            core_tests="$core_tests --test $name"
          done
          echo "gateway-core test binaries:$core_tests"
          cargo test -p gateway-core --quiet $core_tests
          # Web 调试面：全部集成测试二进制（HTTP 契约 / 自愈 / license / 协议能力路由…）
          api_tests=""
          for f in gateway-api/tests/*.rs; do
            api_tests="$api_tests --test $(basename "$f" .rs)"
          done
          echo "gateway-api test binaries:$api_tests"
          cargo test -p gateway-api --quiet $api_tests
        env:
          RUSTFLAGS: ""

      # 基准编译检查：确保 benches/ 不腐烂。完整基准见 bench job（仅 main/手动）。
      # --exclude gateway-desktop：桌面端已冻结，其 Tauri 依赖在 Linux 上需要
      # libwebkit2gtk / libgtk-3 系统开发包，不该拖住交付链路的门禁。
      - name: cargo bench compile check
        run: cargo bench --no-run --workspace --exclude gateway-desktop --quiet
        env:
          RUSTFLAGS: ""

      # F2: 本地预推送同款 supply-chain 检查接入 CI
      # `security.yml` 的 cargo-audit / cargo-deny 仍由该 job 单独跑全量、
      # 跨平台覆盖；此处只是把 scripts/f2_supply_chain_check 集成到日常 PR 检查流，
      # 让 deny 与 audit 的命中点也出现在 check job 的失败页里（更靠近 PR 上下文）。
      # 脚本在工具缺失时优雅 skip，不阻断；CI runner 上 cargo 已是 PATH 一部分，
      # `cargo install cargo-deny --locked` 会快速命中缓存（actions/cache 已留位置）。
      - name: F2 supply-chain check (local mirror)
        run: |
          set -euo pipefail
          bash scripts/f2_supply_chain_check.sh || echo "F2 check exited $? -- see f2_supply_chain_report.txt"
        env:
          RUSTFLAGS: ""
        continue-on-error: true

      - name: Verify ts-rs bindings are up to date
        run: |
          # ts-rs 通过 build.rs 注入 TS_RS_EXPORT_DIR，直接导出到 gateway-web/src/api/generated/，cargo test --lib 触发
          # 用 git status --porcelain 而非 git diff --exit-code：
          # diff 只能捕获"已跟踪文件内容变化"，捕获不到"新增 #[ts(export)] 类型产生的未跟踪 .ts 文件"——
          # 开发者提交了 Rust 类型但忘了提交生成的绑定，旧检查会漏过。
          status=$(git status --porcelain -- gateway-web/src/api/generated/)
          if [ -n "$status" ]; then
            echo "::error::ts-rs generated types are out of date. Run 'cargo test --lib' and commit the updated generated/."
            echo "$status"
            exit 1
          fi

      - name: Verify build order prerequisites
        # Q7: gateway-core 与 gateway-api 为库、先编译，gatewayd 依赖二者；构建顺序 gateway-web -> gatewayd
        # gateway-desktop 已冻结（不再构建/发布），但目录必须保留，防止合并时误删
        run: |
          echo "Build order: gateway-web -> gatewayd (depends on libs gateway-core + gateway-api)；gateway-desktop 已冻结"
          for d in gateway-web gateway-core gateway-api gatewayd gateway-desktop; do
            test -d "$d" || { echo "::error::missing required directory $d"; exit 1; }
          done
          test -f gateway-web/package.json || { echo "::error::missing gateway-web/package.json"; exit 1; }
          test -f gateway-core/Cargo.toml || { echo "::error::missing gateway-core/Cargo.toml"; exit 1; }
          test -f gateway-api/Cargo.toml || { echo "::error::missing gateway-api/Cargo.toml"; exit 1; }
          test -f gatewayd/Cargo.toml || { echo "::error::missing gatewayd/Cargo.toml"; exit 1; }
          test -f gateway-desktop/src-tauri/Cargo.toml || { echo "::error::missing gateway-desktop/src-tauri/Cargo.toml"; exit 1; }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # vitest 5 的 engines 要求 node ^22.12：Node 20 上 vmThreads 池会
          # 整批报 ERR_VM_DYNAMIC_IMPORT_CALLBACK_MISSING（212 个文件起不来）。
          node-version: '22'

      - name: Lint frontend (gateway-web)
        run: |
          cd gateway-web
          npm ci
          npm run lint -- --max-warnings 0
        # #15: lint 错误/警告必须阻断 CI（warning 零容忍，防止持续累积）

      - name: Build frontend (gateway-web)
        run: |
          cd gateway-web
          # B9: vite build 不会触发 vue-tsc 严格类型检查；
          # 显式跑 npm run type-check（vue-tsc --noEmit）单独拦类型错误。
          npm run type-check
          npm run build

      - name: Check bundle size budget (gateway-web)
        run: |
          cd gateway-web
          # 前端 gzip 产物体积门禁：超预算即失败，防止体积无声漂移（约束：500KB–1MB）
          npm run check:bundle

      - name: Run frontend tests with coverage (vitest)
        run: |
          cd gateway-web
          npm run test:coverage -- --reporter=dot
        # #8/#15/#16: 测试失败或覆盖率低于阈值必须阻断 CI

      - name: Upload web coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage-report
          path: gateway-web/coverage/
          retention-days: 7

      - name: Copy frontend dist to ui-dist/
        run: |
          # ui-dist 是构建产物目录（.gitignore 排除），干净 checkout 里不存在
          mkdir -p ui-dist
          rm -rf ui-dist/*
          cp -r gateway-web/dist/* ui-dist/

      - name: Upload web dist artifact
        # 交付包构建 / 本地复现按需取用（desktop 已冻结，不再消费此 artifact）
        uses: actions/upload-artifact@v4
        with:
          name: gateway-web-dist
          path: ui-dist/
          retention-days: 1

      - name: cargo build
        run: cargo build --quiet
        env:
          RUSTFLAGS: ""

      - name: Repo health scan
        run: pwsh scripts/check_repo_health.ps1

      # W2-#19：API 端点清单防漂移
      # 路由源码（web/api/*/routes.rs + web/mod.rs）是唯一事实来源，
      # docs/api-surface.md 必须由 scripts/gen_api_surface.py 重新生成后提交；
      # 新增/删除路由却忘记更新文档时在此失败。
      - name: API surface check
        run: python3 scripts/gen_api_surface.py --check

  # S1 / R1: chaos 场景（当前 47 项真路径恢复测试）由观察期转为**强制门禁**。
  # 观察期内 `continue-on-error: true` 意味着这些用例失败从不阻塞合并——而它们
  # 覆盖的恰恰是总线/协议重构最易回归的故障恢复路径。现直接作为合并门禁。
  chaos:
    name: chaos scenarios
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-chaos-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo test (chaos)
        run: cargo test -p gateway-core --test chaos --quiet
        env:
          RUSTFLAGS: ""

  # S2: 后端 Rust 覆盖率（cargo-llvm-cov）。
  # 统计 gateway-core（引擎）+ gateway-api（Web 面，拆分后）且使用默认 features——切勿追加 --all-features：
  # encryption 会拉入 bundled-sqlcipher，需 OPENSSL_DIR，CI 默认环境不可用。
  # 基线已稳定（首个全绿 run 的 artifact 落盘为分目录阈值），按 ci.yml 同源的
  # scripts/check_coverage.py 落"防回落地板"：低于阈值即失败，
  # 对标前端 gateway-web/vitest.config.ts 的分目录 thresholds 口径。
  coverage:
    name: backend coverage (baseline)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Add llvm-tools-preview
        run: rustup component add llvm-tools-preview

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 独立 key（-cargo-cov-）：instrumented 构建产物与 check job 的缓存互不干扰
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: cargo llvm-cov (lcov)
        run: cargo llvm-cov -p gateway-core -p gateway-api --lcov --output-path lcov.info
        env:
          RUSTFLAGS: ""

      - name: Coverage summary
        run: cargo llvm-cov report -p gateway-core -p gateway-api --summary-only
        env:
          RUSTFLAGS: ""

      - name: Coverage floor (anti-regression)
        run: python3 scripts/check_coverage.py lcov.info

      - name: HTML coverage report
        run: cargo llvm-cov report -p gateway-core -p gateway-api --html
        env:
          RUSTFLAGS: ""

      - name: Upload backend coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: |
            lcov.info
            target/llvm-cov/html/
          retention-days: 7
          if-no-files-found: warn

  # 跨平台编译检查（仅 check，不 build）
  # macOS runner 是 GitHub 上最紧缺的资源，排队超时会被调度器直接取消（表现为灰/红，
  # 与代码无关）。两点降噪：①只跑一遍 `-D dead_code`（原先"普通 check +严格 check"
  # 要编译两遍，RUSTFLAGS 变化会让缓存全失效，耗时翻倍；严格版已包含普通版的覆盖）；
  # ②macOS 结果设为 advisory，runner 短缺不再阻塞合并；Windows 仍为硬门禁。
  cross-platform-check:
    name: check on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os == 'macos-latest' }}
    needs: check
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: cargo check (dead_code strict)
        run: cargo check --all-targets --quiet
        env:
          RUSTFLAGS: "-D dead_code"

  # G2: ARM64 / armv7 交叉编译纳入 CI。
  # 此前 ARM 产物只靠开发机 `deploy/build-release.sh --target linux-arm64` 手工构建：
  # check / 跨平台 / linux-runtime 矩阵全是 x86（win/mac），ARM 上的 cfg 分支
  # （GPIO 字符设备、串口波特率、watchdog、64K 页等）与需要 C 工具链的依赖
  # （rusqlite bundled 的 sqlite3.c）一旦链不上，要等出厂镜像部署到网关才暴露。
  # 这里用发行入口 `-p gatewayd` + `--no-default-features --features sku-standard`
  # 与出厂包同口径构建，只装 ubuntu 官方交叉 gcc（自带目标 libc 头文件），
  # 不引入 Docker/cross，避免额外网络与镜像依赖。
  # armv7 用 gnueabihf（硬浮点 ABI），与网关板卡的软硬浮点约定一致。
  cross-arm:
    name: cross build (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-gnu
            cc: aarch64-linux-gnu-gcc
            pkg: gcc-aarch64-linux-gnu
            qemu: qemu-aarch64-static
            qemu_alt: qemu-aarch64
            sysroot: /usr/aarch64-linux-gnu
            loader: ld-linux-aarch64.so.1
          - target: armv7-unknown-linux-gnueabihf
            cc: arm-linux-gnueabihf-gcc
            pkg: gcc-arm-linux-gnueabihf
            qemu: qemu-arm-static
            qemu_alt: qemu-arm
            sysroot: /usr/arm-linux-gnueabihf
            loader: ld-linux-armhf.so.3
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 独立 key（-cargo-${{ matrix.target }}-）：交叉产物与宿主构建缓存互不干扰
          key: ${{ runner.os }}-cargo-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cross gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y ${{ matrix.pkg }}

      - name: cargo build (gatewayd, release features)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          # cc-rs 读 CC_<target，rustc 读 CARGO_TARGET_<TARGET>_LINKER（大写、连字符转下划线）
          export "CC_${TARGET//-/_}=${{ matrix.cc }}"
          export "CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.cc }}"
          cargo build -p gatewayd --target "$TARGET" \
            --no-default-features --features sku-standard --locked
          # 产物必须是目标架构的 ELF：只编译通过不代表链接出来的 ABI 正确
          file "target/$TARGET/debug/gatewayd"

      # ===== QEMU 运行时验证 =====
      # 交叉编译通过 ≠ ARM 上能跑。链接到宿主库、缺 .so、动态链接器不匹配、
      # 原子指令对齐 / 浮点 ABI 差异，这些都只有"真的跑一下"才暴露，
      # 而此前 CI 对 ARM 产物只编译、从不运行——真机到手前完全没有运行时保证。
      # 这里用 QEMU user-mode 模拟器在 CI 里补上这一段：
      #   1) ARM 产物能被目标 ABI 的动态链接器装载并执行到 Rust 代码；
      #   2) ARM 上真跑一部分确定性测试（架构敏感的纯函数 + 采集→北向端到端接线）。
      # QEMU 不是真机，但它是"真机冒烟"之前能拿到的最强保证。

      - name: Install QEMU user-mode emulator and ARM sysroot
        run: |
          set -euo pipefail
          sudo apt-get update
          # 目标 ABI 的 libc 头与动态链接器。
          # 这两个包通常已被上面的交叉 gcc 包顺带装上，装不上不直接失败——
          # 下面的 loader 存在性检查才是真正的判据。
          sudo apt-get install -y libc6-dev-arm64-cross libc6-dev-armhf-cross \
            || echo "警告：额外的 libc 交叉包安装失败，以 loader 检查为准"

          # 目标 ABI 的动态链接器必须在 sysroot 里。缺了它，QEMU 报的正是
          # "Error loading shared library"——那正是本作业要抓的失败模式，
          # 所以缺 loader 要在这里就报出来，而不是等到运行时才发现。
          test -e "${{ matrix.sysroot }}/lib/${{ matrix.loader }}" || {
            echo "sysroot 缺少动态链接器: ${{ matrix.sysroot }}/lib/${{ matrix.loader }}" >&2
            exit 1
          }

          # 解析出实际可用的 qemu 可执行文件。静态版（*-static）与动态版
          # （qemu-aarch64 / qemu-arm）在不同发行版里的归属包不同，
          # 两种都能用，就近选一个存在的。
          find_qemu() {
            local cand
            for cand in "${{ matrix.qemu }}" "${{ matrix.qemu_alt }}"; do
              if command -v "$cand" >/dev/null 2>&1; then
                command -v "$cand"
                return 0
              fi
            done
            return 1
          }

          # Ubuntu 26.04 起 qemu-user-static 是"虚拟包"（apt 直接报
          # "Package 'qemu-user-static' has no installation candidate"），
          # 实际由 qemu-user-binfmt / qemu-user-binfmt-hwe 提供；
          # 动态版可执行文件则来自 qemu-user。
          # 逐个候选包尝试：装上后必须真的能找到可执行文件才算成功。
          qemu_bin=""
          installed=""
          for pkg in qemu-user-binfmt qemu-user-binfmt-hwe qemu-user-static qemu-user; do
            if sudo apt-get install -y "$pkg"; then
              if qemu_bin="$(find_qemu)"; then
                installed="$pkg"
                break
              fi
              echo "包 $pkg 装上了但没提供 qemu 可执行文件，继续尝试下一个" >&2
            else
              echo "包 $pkg 不可用，尝试下一个候选" >&2
            fi
          done
          [ -n "$qemu_bin" ] || { echo "没有可用的 QEMU 用户态模拟器" >&2; exit 1; }
          echo "已安装 QEMU 包: $installed"
          echo "QEMU_BIN=$qemu_bin"
          # 用变量接住再取首行：管道 + pipefail 下 head 提前退出会给 qemu 发 SIGPIPE，
          # 导致这一步误判失败。
          qemu_ver="$("$qemu_bin" --version 2>&1 || true)"
          printf '%s\n' "$qemu_ver" | head -n 1
          echo "QEMU_BIN=$qemu_bin" >> "$GITHUB_ENV"

          # cargo 的 target runner 只接受"可执行文件路径"，不能带参数
          # （"qemu-aarch64 -L /sysroot" 会被当成一个字面路径去找）。
          # 故生成一个固定 sysroot 的包装脚本，让 cargo 直接跑这个脚本。
          runner_sh="$RUNNER_TEMP/qemu-runner.sh"
          cat > "$runner_sh" << EOF
          #!/usr/bin/env bash
          exec "$qemu_bin" -L "${{ matrix.sysroot }}" "\$@"
          EOF
          chmod +x "$runner_sh"
          runner_ver="$("$runner_sh" --version 2>&1 || true)"
          printf '%s\n' "$runner_ver" | head -n 1
          echo "QEMU_RUNNER=$runner_sh" >> "$GITHUB_ENV"

      - name: QEMU runtime smoke (ARM binary actually loads and runs)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BIN="$GITHUB_WORKSPACE/target/$TARGET/debug/gatewayd"
          WORK="$(mktemp -d)"

          # 把配置路径指向不存在的文件：gatewayd 会因配置缺失而退出。
          # 退出本身不是失败，要点在于它能走到 Rust 代码里——
          # 若动态链接失败，QEMU 会在进入 main 之前就报 loader 错误。
          # 若它反而用默认配置起来了，timeout 会把它掐掉（rc=124），
          # 同样说明装载成功。
          set +e
          out=$(cd "$WORK" && GATEWAY_CONFIG_PATH="$WORK/absent-config.json" \
                timeout --signal=KILL 60 \
                "$QEMU_BIN" -L "${{ matrix.sysroot }}" "$BIN" 2>&1)
          rc=$?
          set -e
          echo "--- qemu exit=$rc ---"
          echo "$out" | tail -n 40

          if printf '%s' "$out" | grep -qiE \
            'Error loading shared library|cannot open shared object|exec format error|qemu: Could not open|qemu: uncaught target signal'; then
            echo "QEMU 装载失败：ARM 产物无法在目标 ABI 的动态链接器下装载" >&2
            exit 1
          fi
          # 缺配置时程序应当干净地报错退出；panic 说明 ARM 上跑出了宿主上不复现的
          # 问题（原子指令对齐 / 浮点 / 越界），这正是这道门禁要抓的信号。
          if printf '%s' "$out" | grep -q 'panicked at'; then
            echo "QEMU 运行期 panic：ARM 产物在目标架构上崩溃" >&2
            exit 1
          fi
          # 走到 Rust 代码的标志：配置加载阶段的报错（中文上下文串）出现在输出里。
          # 若配置缺失时程序走的是"自动生成默认配置"分支，这里会不匹配——
          # 那时至少已证明装载成功，故降级为提示而非失败。
          if printf '%s' "$out" | grep -q '加载配置失败'; then
            echo "OK：ARM 产物已装载并执行到 Rust 代码（配置缺失报错符合预期）"
          else
            echo "NOTE：未观察到预期的配置缺失报错，但未出现 loader 错误，装载阶段通过"
          fi

      - name: QEMU runtime tests (run ARM test binaries)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          export "CC_${TARGET//-/_}=${{ matrix.cc }}"
          export "CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_LINKER=${{ matrix.cc }}"
          # cargo 用这个 runner 启动交叉编译出的测试二进制，QEMU 负责实际执行。
          # runner 必须是无参数的脚本路径（见上一步生成的包装脚本）。
          export "CARGO_TARGET_$(echo "$TARGET" | tr 'a-z-' 'A-Z_')_RUNNER=$QEMU_RUNNER"

          # 断言"确实跑了测试"：过滤条件失配时 cargo 会报 0 passed 并返回 0，
          # 那样这道门禁会静默退化成空跑——必须显式卡住。
          run_tests() {
            local label="$1"; shift
            local out="/tmp/qemu-test-${label}.log"
            set +e
            "$@" 2>&1 | tee "$out"
            local rc=${PIPESTATUS[0]}
            set -e
            [ "$rc" -eq 0 ] || { echo "qemu 测试失败: $label (rc=$rc)" >&2; exit "$rc"; }
            grep -Eq 'test result: ok\. [1-9][0-9]* passed' "$out" || {
              echo "qemu 测试未实际执行任何用例: $label（过滤条件可能失配）" >&2
              exit 1
            }
          }

          # ① 架构敏感的纯函数（字节序 / CRC / 编码）：这部分在 x86 上过、
          #    在 ARM 上未必过——正是 QEMU 模拟器能替真机提前抓到的差异。
          run_tests lib cargo test -p gateway-core --target "$TARGET" --locked \
            --lib -- engine::util::

          # ② 采集 → 虚拟点位派生 → 入队 → 北向扇出的端到端接线：
          #    在 ARM 上真跑一遍，确认队列 / RealtimeBus / 转换链在目标架构上成立。
          run_tests vpp cargo test -p gateway-core --target "$TARGET" --locked \
            --test virtual_point_pipeline
        env:
          # 测试代码里的 warning 不该阻断"在 ARM 上能不能跑"这个判定；
          # 生产代码的 warning 仍由 check job 的 -D warnings 严格把关。
          RUSTFLAGS: ""

  # A: musl 静态链接构建（消除交付物与设备 glibc 版本的耦合）。
  # 问题：cross-arm 产出的是 *-linux-gnu 动态链接二进制，它带着「构建机 glibc 版本」
  # 这个隐藏要求 —— CI 跑在 ubuntu-latest（glibc 2.39），而现场常见 Debian 10(2.28)/
  # 11(2.31)、Buildroot/Yocto（musl）。这类设备上连启动都到不了，直接
  # "GLIBC_2.39 not found"，但所有 CI 作业会全绿。
  # 做法：用 musl target 静态链接（不依赖任何目标机 libc），并**真的运行一次**。
  # 为什么用 cross：bundled sqlite3.c 需要目标 ABI 的 musl C 工具链，Ubuntu 的 apt
  # 只提供宿主 musl-gcc，没有 aarch64/armv7 的 musl 交叉编译器，cross 镜像自带。
  static-musl:
    name: static musl (${{ matrix.target }})
    runs-on: ubuntu-latest
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            emu: ""
            pkg: qemu-user-static
          - target: aarch64-unknown-linux-musl
            emu: qemu-aarch64
            pkg: qemu-user-static
          - target: armv7-unknown-linux-musleabihf
            emu: qemu-arm
            pkg: qemu-user-static
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.target }}

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-musl-${{ matrix.target }}-${{ hashFiles('**/Cargo.lock') }}

      # 安装 cross（自带 musl 交叉工具链镜像）；ARM 还需要 qemu user-mode 来运行产物
      - uses: taiki-e/install-action@cross
      - name: Install QEMU user-mode emulator
        if: matrix.emu != ''
        run: |
          set -euo pipefail
          sudo apt-get update
          # qemu-user-static 在新版 Ubuntu 上是虚拟包，实际由 binfmt 包提供；逐个试
          sudo apt-get install -y ${{ matrix.pkg }} || sudo apt-get install -y qemu-user-binfmt
          command -v "${{ matrix.emu }}" >/dev/null 2>&1 || command -v "${{ matrix.emu }}"-static

      - name: cross build (gatewayd, release features)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          cross build --release -p gatewayd --target "$TARGET" \
            --no-default-features --features sku-standard --locked
          BIN="target/$TARGET/release/gatewayd"
          file "$BIN"
          # 必须是静态链接：动态链接就失去 musl 的全部意义，等于白做
          # x86_64 musl 默认 PIE，`file` 报 "static-pie linked"；非 PIE 报 "statically linked"
          file "$BIN" | grep -Eq "statically linked|static-pie linked" || {
            echo "✗ 产物不是静态链接，仍会依赖目标机 glibc" >&2
            exit 1
          }

      # ===== 运行时验证 =====
      # 静态链接只证明"不需要目标机 libc"，不证明"能起来"。这里用最小配置真跑一次，
      # 探 /health/live；ARM 产物走 QEMU user-mode（不模拟硬件，只验证 ABI 与启动路径）。
      - name: Runtime smoke (start + /health/live)
        run: |
          set -euo pipefail
          TARGET="${{ matrix.target }}"
          BIN="target/$TARGET/release/gatewayd"
          WORK="$(mktemp -d)"
          cat > "$WORK/config.json" <<'JSON'
          {"buses": [], "points": [], "mqtt": {}, "web": {"allow_anon_read": true, "listen_addr": "127.0.0.1:18099"}}
          JSON
          export GATEWAY_CONFIG_PATH="$WORK/config.json" \
            GATEWAY_DB_PATH="$WORK/data_queue.db" \
            GATEWAY_VERSION_DB="$WORK/config_versions.db" \
            GATEWAY_OUTBOX_DB="$WORK/mqtt_outbox.db" \
            GATEWAY_AUDIT_LOG="$WORK/audit.log" \
            GATEWAY_DIAG_LOG="$WORK/gateway.log" \
            GATEWAY_LOG_DIR="$WORK/logs" \
            GATEWAY_OTA_STAGING="$WORK/ota" \
            GATEWAY_TEMPLATE_BUILTIN="$WORK/templates/builtin" \
            GATEWAY_TEMPLATE_CUSTOM="$WORK/templates/custom" \
            GATEWAY_LUA_SCRIPT="$WORK/process.lua" \
            GATEWAY_CERT_DIR="$WORK/certs" \
            GATEWAY_LICENSE_CLOCK_DB="$WORK/license_clock.db"
          EMU="${{ matrix.emu }}"
          if [ -n "$EMU" ]; then
            QEMU="$EMU"
            command -v "$QEMU" >/dev/null 2>&1 || QEMU="$EMU-static"
            "$QEMU" "$BIN" >"$WORK/out.log" 2>&1 &
          else
            "$BIN" >"$WORK/out.log" 2>&1 &
          fi
          PID=$!
          READY=0
          for _ in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:18099/health/live >/dev/null 2>&1; then
              READY=1; break
            fi
            kill -0 "$PID" 2>/dev/null || break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [ "$READY" != "1" ]; then
            echo "✗ 静态产物未能启动并通过 /health/live（$TARGET）" >&2
            tail -n 40 "$WORK/out.log" >&2 || true
            exit 1
          fi
          echo "✓ 静态产物启动成功并通过 /health/live（$TARGET）"

  # L1: encryption feature 编译验证。
  # 生产构建通过 `--features encryption` 启用 SQLite 加密（bundled-sqlcipher），但历史上
  # 该路径只在开发者本机手工构建过，CI 的默认 feature 构建完全绕开它——加密相关的
  # cfg 分支（cipher 打开/密钥处理）一旦编译失败，要到发生产包时才暴露。
  # bundled-sqlcipher 需要 OpenSSL 头文件与 perl，故先安装依赖再单独 check 两个库 crate。
  encryption-check:
    name: encryption feature build
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - uses: dtolnay/rust-toolchain@1.98.1

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-enc-${{ hashFiles('**/Cargo.lock') }}

      - name: Install OpenSSL build deps
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config perl

      - name: cargo check (encryption)
        run: |
          set -euo pipefail
          cargo check -p gateway-core --all-targets --features encryption --quiet
          cargo check -p gateway-api --all-targets --features encryption --quiet
        env:
          RUSTFLAGS: ""

  # Linux 专用：硬件 watchdog / gpiod / 串口权限测试
  linux-runtime:
    name: linux runtime checks
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      # 仅编译，不跑需要硬件的测试
      - name: build linux variant
        run: cargo build --quiet --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: ""

  # Playwright E2E 冒烟（阶段 3：强制门禁）
  # ─────────────────────────────────────────────────────────
  # S5: 由观察期转为强制门禁——用例失败将阻塞合并。
  # 编排细节见 gateway-web/playwright.config.ts：webServer 自动拉起空配置
  # gatewayd（scripts/e2e/start-gateway.mjs，二进制取 target/debug/gatewayd）
  # 与 vite:5199，测试结束自动回收。
  e2e:
    name: e2e smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1

      # 独立 key（-cargo-e2e-）：与其他 job 的 target 缓存互不干扰
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-e2e-${{ hashFiles('**/Cargo.lock') }}

      # 只编译 E2E 需要的 gatewayd（web 静态目录运行时解析，无构建期 ui-dist 依赖）
      - name: Build gatewayd
        run: cargo build -p gatewayd --quiet
        env:
          RUSTFLAGS: ""

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # 与前端作业保持一致：vite 8 / vitest 5 都要求 node ≥ 22.12
          node-version: '22'

      - name: Install frontend deps
        run: |
          cd gateway-web
          npm ci

      - name: Install Playwright chromium
        run: |
          cd gateway-web
          npx playwright install --with-deps chromium

      # --with-deps 不含中文字体；装上后失败截图/视频里的中文才可读，方便排障
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk

      - name: Run E2E smoke
        run: |
          cd gateway-web
          npm run e2e

      # e2e 已是强制门禁（见本 job 顶部 S5 说明），此处用 always() 是为了
      # **用例失败时仍上传**报告/trace（默认 success() 会跳过）。
      # test-results 仅失败时有内容，用 if-no-files-found: ignore 兜底
      - name: Upload Playwright report & traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-playwright-report
          path: |
            gateway-web/playwright-report/
            gateway-web/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # gateway-desktop 已冻结（2026-11）：
  # 桌面端只服务早期现场调试，现统一由 Web 控制台承担；冻结含义是**不再构建/打包/
  # 发布**，代码保留在原地避免历史分支合并丢文件。原 desktop-build job（windows
  # 上 npm ci + cargo check/clippy）已移除，不再消耗 CI 分钟。
  # 冻结不等于删除：目录与代码仍在 workspace members 里，但已从 default-members
  # 移出——Tauri 在 Linux 上需要 libwebkit2gtk / libgtk-3 系统开发包，会把交付
  # 链路的门禁拖死。兜底改为本地 `cargo check -p gateway-desktop`；
  # 若未来要恢复，把本 job 从 git 历史中恢复即可。

  # G5 交付链路进 CI：安装 → 验证 → 交付检查单。
  # 此前 install.sh / verify-deploy.sh / deliver.sh 从未在任何 Linux 上执行过
  # （开发机是 Windows，无 bash/WSL），语法错与路径错只能等交付现场才暴露。
  # 这里把它们钉进 CI：deploy-lint 做静态检查，deploy-smoke 在 runner 上真跑一遍。
  deploy-lint:
    name: deploy script lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: bash syntax check
        run: |
          set -euo pipefail
          for f in gateway-core/deploy/install.sh \
                   deploy/verify-deploy.sh \
                   deploy/deliver.sh \
                   deploy/build-release.sh; do
            echo "→ bash -n $f"
            bash -n "$f"
          done

      # 先当告警看：把 shellcheck 的问题清单暴露出来，清零后再改成阻断门禁
      - name: shellcheck (advisory)
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -S warning gateway-core/deploy/install.sh \
            deploy/verify-deploy.sh deploy/deliver.sh deploy/build-release.sh

  # 真实交付冒烟：拼一个「发布包」目录 → sudo bash deliver.sh 一条命令走完
  # 安装 → 等待就绪 → 验证 → 导出交付检查单。runner 上有 systemd + 免密 sudo，
  # 因此 install.sh 的 useradd/systemctl/健康检查都是真跑，不是打桩。
  deploy-smoke:
    name: deploy smoke (install + verify)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - uses: dtolnay/rust-toolchain@1.98.1

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-deploy-${{ hashFiles('**/Cargo.lock') }}

      # 与出厂口径一致：裁剪到 sku-standard（冒烟不追求全协议）
      - name: Build gatewayd (sku-standard)
        run: cargo build -p gatewayd --no-default-features --features sku-standard --quiet
        env:
          RUSTFLAGS: ""

      - uses: actions/setup-node@v4
        with:
          # vite 8 要求 node ≥ 22.12（与前端作业同一运行时）
          node-version: '22'

      - name: Build frontend
        run: |
          cd gateway-web
          npm ci
          npm run build

      # 复刻 build-release.sh 的包内布局（install.sh 只认「脚本同级」的二进制/前端）
      - name: Assemble release-like package
        run: |
          set -euo pipefail
          PKG="$RUNNER_TEMP/gw-pkg"
          rm -rf "$PKG"; mkdir -p "$PKG"
          cp target/debug/gatewayd "$PKG/gatewayd"
          cp -r gateway-web/dist "$PKG/ui-dist"
          cp gateway-core/deploy/gateway.service "$PKG/"
          cp gateway-core/deploy/install.sh "$PKG/"
          cp deploy/verify-deploy.sh deploy/deliver.sh "$PKG/"
          cp -r templates "$PKG/templates"
          # 现场配置：走「install.sh 装配置 → root:gateway 权限 → verify 用 api_token 鉴权」这条真实路径。
          # 结构对齐 gateway-core/src/config/fixtures/config/v0_minimal.json（buses/points/mqtt 必填）
          cat > "$PKG/config.json" << 'EOF'
          {
            "buses": [],
            "points": [],
            "mqtt": {},
            "web": {
              "listen_addr": "127.0.0.1:8080",
              "api_token": "ci-smoke-token-0123456789",
              "username": "admin",
              "password_hash": "",
              "allow_anon_read": false
            }
          }
          EOF
          cat > "$PKG/BUILD-INFO.txt" << 'EOF'
          # 出厂镜像构建信息（CI 冒烟自造，格式对齐 deploy/build-release.sh）
          build_time=ci-smoke
          target=host
          rust_target=x86_64-unknown-linux-gnu
          sku=standard
          protocols=modbus,dlt645,cjt188,iec104,opcua
          feature_args=--no-default-features --features sku-standard
          EOF
          ls -l "$PKG"

      - name: Run deliver.sh (install + wait + verify + checklist)
        run: |
          set -uo pipefail
          sudo bash "$RUNNER_TEMP/gw-pkg/deliver.sh" --timeout 90 | tee "$RUNNER_TEMP/deliver.log"
          test "${PIPESTATUS[0]}" -eq 0

      # 常驻内存基线：SKU 裁剪省下的是磁盘体积，而 ARM 小内存机型选型看的是 RSS。
      # 在真实 systemd 服务上采样，超阈值即失败，防止「体积降了、内存涨了」这类静默回退。
      - name: Measure resident memory (RSS gate)
        run: |
          set -euo pipefail
          PID="$(sudo systemctl show -p MainPID --value gateway)"
          if [ "$PID" = "0" ] || [ ! -d "/proc/$PID" ]; then
            echo "gateway 未运行，无法测量 RSS" >&2
            exit 1
          fi
          rss() { awk '/^VmRSS:/{print $2}' "/proc/$PID/status"; }
          sleep 5
          base="$(rss)"
          sleep 15
          now="$(rss)"
          mib="$(awk -v k="$now" 'BEGIN{printf "%.1f", k/1024}')"
          grow_kib=$(( now - base ))
          {
            echo "### 常驻内存（sku-standard，真实 systemd 服务）"
            echo ""
            echo "| 指标 | 实测 | 阈值 |"
            echo "|---|---|---|"
            echo "| 稳态 RSS | ${mib} MiB | 128 MiB |"
            echo "| 15s 内 RSS 增长 | ${grow_kib} KiB | 4096 KiB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$now" -gt 131072 ]; then
            echo "RSS ${mib} MiB 超过 128 MiB 上限（部署到 ARM 小内存机型会 OOM）" >&2
            exit 1
          fi
          if [ "$grow_kib" -gt 4096 ]; then
            echo "15s 内 RSS 增长 ${grow_kib} KiB：疑似启动后仍在分配或泄漏" >&2
            exit 1
          fi

      # 受限资源运行（C）：工业小内存机型（256 MB）才是真实目标。
      # RSS 门禁只回答「用了多少」，不回答「给 256 MB 够不够」——两种失败模式必须提前知道：
      #   优雅降级（限流/拒绝新连接）  vs  被 cgroup OOM 直接杀进程。
      # 在真实 systemd 服务上加 MemoryMax + CPUQuota 后继续观察：
      #   进程存活、/health/live 仍 200、cgroup 未发生 oom_kill。
      - name: Verify under memory cap (256M + 50% CPU)
        run: |
          set -euo pipefail
          CAP_MB=256
          sudo systemctl set-property gateway MemoryMax=${CAP_MB}M CPUQuota=50%
          sleep 3
          PID="$(sudo systemctl show -p MainPID --value gateway)"
          if [ "$PID" = "0" ] || [ ! -d "/proc/$PID" ]; then
            echo "限制生效后 gateway 已不在运行（疑似被 OOM 杀）" >&2
            sudo systemctl status gateway --no-pager || true
            sudo journalctl -u gateway -n 60 --no-pager || true
            exit 1
          fi
          # 从 /proc/<pid>/cgroup 反查 cgroup 路径，兼容 cgroup v1/v2 挂载差异
          CG_REL="$(awk -F: '{print $3}' "/proc/$PID/cgroup" | tail -n1)"
          CG="/sys/fs/cgroup${CG_REL}"
          OOM_KILL=0
          PEAK_BYTES=0
          if [ -f "$CG/memory.events" ]; then
            OOM_KILL="$(awk '/^oom_kill /{print $2}' "$CG/memory.events" || true)"
            OOM_KILL="${OOM_KILL:-0}"
            # 注意：cgroup v2 的 memory.peak 单位是「字节」（不是 KiB），算错会差 1024 倍
            PEAK_BYTES="$(cat "$CG/memory.peak" 2>/dev/null || echo 0)"
            PEAK_BYTES="${PEAK_BYTES:-0}"
          else
            echo "::warning::未找到 $CG/memory.events（cgroup v1？），OOM 计数跳过"
          fi
          # 在限额下持续打健康接口：能稳定返回 200 说明是「活着的降级」而非卡死
          FAILS=0
          RSS_MAX_KIB=0
          for _ in $(seq 1 20); do
            CODE="$(curl -s -o /dev/null -w '%{http_code}' --max-time 3 \
              http://127.0.0.1:8080/health/live || true)"
            [ "$CODE" = "200" ] || FAILS=$((FAILS + 1))
            # 顺带采一次常驻内存（VmRSS，单位 KiB），作为「限额内实际占用」的实测值
            RSS_KIB="$(awk '/^VmRSS:/ {print $2}' "/proc/$PID/status" 2>/dev/null || echo 0)"
            RSS_KIB="${RSS_KIB:-0}"
            # 用 if 而非 `[ ] &&`：set -e 下条件为假会让整段返回非零而中断脚本
            if [ "$RSS_KIB" -gt "$RSS_MAX_KIB" ]; then RSS_MAX_KIB="$RSS_KIB"; fi
          done
          PEAK_MIB="$(awk -v b="$PEAK_BYTES" 'BEGIN{printf "%.1f", b/1048576}')"
          RSS_MAX_MIB="$(awk -v k="$RSS_MAX_KIB" 'BEGIN{printf "%.1f", k/1024}')"
          {
            echo "### 受限资源运行（MemoryMax=${CAP_MB}M, CPUQuota=50%）"
            echo ""
            echo "| 指标 | 实测 | 判定 |"
            echo "|---|---|---|"
            echo "| 限额内最大常驻内存 RSS | ${RSS_MAX_MIB} MiB | ≤ ${CAP_MB} MiB |"
            echo "| cgroup 峰值内存（服务启动以来） | ${PEAK_MIB} MiB | ≤ ${CAP_MB} MiB |"
            echo "| oom_kill 次数 | ${OOM_KILL} | 0 |"
            echo "| 健康接口失败数 | ${FAILS}/20 | 0 |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${OOM_KILL:-0}" -gt 0 ]; then
            echo "在 ${CAP_MB} MiB 限额下发生 OOM kill：该机型会直接杀进程（非优雅降级）" >&2
            exit 1
          fi
          if [ "$FAILS" -gt 0 ]; then
            echo "限额下健康接口失败 ${FAILS}/20：资源受限时服务不可用" >&2
            exit 1
          fi
          echo "✓ ${CAP_MB} MiB / 50% CPU 下存活且健康（限额内 RSS 峰值 ${RSS_MAX_MIB} MiB，cgroup 峰值 ${PEAK_MIB} MiB）"

      # 失败时把现场留证：服务状态 + 日志 + 交付检查单
      - name: Collect systemd snapshot
        if: always()
        run: |
          sudo systemctl status gateway --no-pager || true
          sudo journalctl -u gateway -n 80 --no-pager || true

      - name: Upload delivery checklist
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-checklist
          path: |
            ${{ runner.temp }}/gw-pkg/out/*.md
            ${{ runner.temp }}/deliver.log
          if-no-files-found: warn

  # 性能基准：完整 criterion 基准仅在 main 合并或手动触发时运行。
  # PR 时由 check job 的 "cargo bench compile check" 保证 benches/ 能编译。
  # criterion 默认 100 samples，完整跑约 5-10 分钟，不阻塞 PR。
  bench:
    name: performance benchmarks
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-bench-${{ hashFiles('**/Cargo.lock') }}

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: cargo bench
        run: cargo bench --workspace --exclude gateway-desktop
        env:
          RUSTFLAGS: ""

      - name: Upload criterion HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: criterion-bench-report
          path: target/criterion/
          retention-days: 30

  # L4: 内存泄漏冒烟门禁。
  # 浸泡农场此前只能在 Windows 本机用 scripts/soak.ps1 跑，CI 完全不覆盖：
  # 内存泄漏 / 句柄泄漏这类回退在 PR 阶段无人把关，只能上线后暴雷。
  # 这里用 scripts/soak.sh（soak.ps1 的 Linux 等价实现）跑一轮短时浸泡，
  # 由 soak_verdict 判定器给出通过 / 不通过，作为硬门禁。
  #
  # 时长下限 600s：判定会剔除「故障窗口 + 60s 恢复期」的采样，
  # 时长过短会让稳态样本对为空，成功率 / 队列 / 北向判定退化成 note 而非失败，
  # 门禁形同虚设。600s / 4 总线 × 10 从站 × 25 点 = 1000 点，是本地实测全绿的一组参数。
  soak-smoke:
    name: soak smoke (memory leak gate)
    runs-on: ubuntu-latest
    needs: check
    timeout-minutes: 45
    env:
      RUSTFLAGS: ""
      SOAK_DURATION_SECS: "600"
      SOAK_BUSES: "4"
      SOAK_SLAVES_PER_BUS: "10"
      SOAK_POINTS_PER_SLAVE: "25"
      SOAK_INTERVAL_SECS: "5"
      SOAK_SAMPLE_MS: "10000"
      SOAK_OUT_DIR: gateway-core/soak-out
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          # 独立 key（-cargo-soak-）：soak 编译产物与其它作业互不干扰
          key: ${{ runner.os }}-cargo-soak-${{ hashFiles('**/Cargo.lock') }}

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Run soak and judge
        run: bash scripts/soak.sh

      # 判定器在 proc.jsonl 样本不足时只记 note、不判失败——那会让「内存泄漏门禁」
      # 静默退化成空跑。这里显式断言样本数，确保 RSS / 句柄判定确实被执行。
      - name: Assert process-level samples captured
        run: |
          set -euo pipefail
          proc="$SOAK_OUT_DIR/proc.jsonl"
          if [ ! -f "$proc" ]; then
            echo "proc.jsonl 未生成：Linux /proc 采样失效，RSS / 句柄判定会被跳过" >&2
            exit 1
          fi
          n=$(wc -l < "$proc")
          echo "proc.jsonl 样本数 = $n"
          if [ "$n" -lt 2 ]; then
            echo "proc.jsonl 样本不足 2 条：RSS / 句柄判定会被跳过" >&2
            exit 1
          fi
          head -n 2 "$proc"
          tail -n 2 "$proc"

      - name: Publish verdict to job summary
        if: always()
        run: |
          if [ -f "$SOAK_OUT_DIR/report.md" ]; then
            {
              echo "### soak smoke 判定报告"
              echo
              cat "$SOAK_OUT_DIR/report.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload soak artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: soak-smoke-report
          path: gateway-core/soak-out/
          retention-days: 14
          if-no-files-found: warn

  # SKU 体积观测：docs/functional-inventory-and-next-roadmap.md §1.6 待办第 1 条。
  # 5 个 SKU 的 release 产物体积此前从未实测，裁剪决策建立在估算上。
  # 这里跑 release 构建，出一张「协议数 / 唯一依赖 crate / 产物体积」的表，
  # 纯观测项：只出数据，不改门禁判定，结论由人工判断。
  # 仅在 main 合并后 / 手动触发时运行，不阻塞 PR。
  sku-size-matrix:
    name: sku size matrix
    runs-on: ubuntu-latest
    needs: check
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 60
    env:
      RUSTFLAGS: ""
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.98.1
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-skusize-${{ hashFiles('**/Cargo.lock') }}

      - name: Override cargo config for CI
        run: |
          mkdir -p .cargo
          cat > .cargo/config.toml << 'EOF'
          [net]
          git-fetch-with-cli = true
          EOF

      - name: Build SKUs (release) and measure size
        run: |
          set -euo pipefail
          SKU_TOML="gateway-core/Cargo.toml"
          OUT_DIR="$RUNNER_TEMP/sku-size"
          mkdir -p "$OUT_DIR"

          # SKU 表单一来源 = gateway-core/Cargo.toml 的 sku-* 定义，新增 SKU 自动纳入
          skus=$(awk -F'=' '/^sku-[a-z0-9-]+[[:space:]]*=/ { k=$1; gsub(/[[:space:]]/, "", k); sub(/^sku-/, "", k); print k }' "$SKU_TOML")
          echo "SKU matrix: $skus"

          # 单个 SKU 的协议清单（与 deploy/build-release.sh 的 sku_protocols 同口径）
          sku_protocols() {
            awk -v key="sku-$1" '
              $0 ~ "^" key "[[:space:]]*=" {
                v = $0
                sub(/^[^=]*=[[:space:]]*\[/, "", v)
                sub(/\].*$/, "", v)
                gsub(/[",]/, "", v)
                gsub(/[[:space:]]+/, ",", v)
                gsub(/,+/, ",", v)
                sub(/^,/, "", v)
                sub(/,$/, "", v)
                print v
                exit
              }
            ' "$SKU_TOML"
          }

          for sku in $skus; do
            echo "==> building sku-$sku"
            cargo build --release -p gatewayd --no-default-features --features "sku-$sku" --quiet
            bin="target/release/gatewayd"
            if [ ! -f "$bin" ]; then
              echo "missing artifact: $bin" >&2
              exit 1
            fi
            size=$(stat -c %s "$bin")
            protos=$(sku_protocols "$sku")
            deps=$(cargo tree -p gatewayd --no-default-features --features "sku-$sku" --prefix none 2>/dev/null \
                   | awk '{print $1}' | sort -u | wc -l)
            printf '%s|%s|%s|%s\n' "$sku" "$size" "$protos" "$deps" >> "$OUT_DIR/sizes.tsv"
          done

          base=$(awk -F'|' '{ if (min == "" || $2 < min) min = $2 } END { print min }' "$OUT_DIR/sizes.tsv")
          {
            echo "### SKU 体积矩阵（release 构建）"
            echo
            echo "| SKU | 协议数 | 协议清单 | 唯一依赖 crate | 产物体积 | 相对最小 SKU |"
            echo "|---|---|---|---|---|---|"
            while IFS='|' read -r sku size protos deps; do
              n=$(printf '%s' "$protos" | tr ',' '\n' | grep -c . || true)
              pct=$(awk -v s="$size" -v b="$base" 'BEGIN { printf "%+.1f%%", (s - b) * 100.0 / b }')
              mib=$(awk -v s="$size" 'BEGIN { printf "%.1f MiB", s / 1048576 }')
              printf '| `sku-%s` | %s | %s | %s | %s | %s |\n' "$sku" "$n" "$protos" "$deps" "$mib" "$pct"
            done < "$OUT_DIR/sizes.tsv"
          } > "$OUT_DIR/sku-size.md"

          cat "$OUT_DIR/sku-size.md"
          cat "$OUT_DIR/sku-size.md" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload size matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sku-size-matrix
          path: ${{ runner.temp }}/sku-size/
          retention-days: 30
          if-no-files-found: warn

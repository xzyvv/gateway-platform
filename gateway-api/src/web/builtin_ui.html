<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gateway Platform</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; max-width: 720px; margin: 4rem auto; padding: 0 1.5rem; line-height: 1.6; }
  h1 { font-size: 1.5rem; }
  code { background: rgba(127,127,127,.15); padding: .1em .4em; border-radius: 4px; }
  ul { padding-left: 1.2rem; }
  li { margin: .3rem 0; }
  a { color: #2563eb; }
  .hint { margin-top: 2rem; padding: 1rem; border-left: 3px solid #2563eb; background: rgba(37,99,235,.06); }
</style>
</head>
<body>
  <h1>Gateway Platform</h1>
  <p>网关服务已启动。当前为<strong>嵌入式兜底 UI</strong>，完整调试控制台未部署。</p>
  <h2>可用端点</h2>
  <ul>
    <li><a href="/health/live">/health/live</a> — 存活探针</li>
    <li><a href="/health/ready">/health/ready</a> — 就绪探针</li>
    <li><a href="/api/status">/api/status</a> — 网关运行状态</li>
    <li><a href="/api/version">/api/version</a> — 版本信息</li>
    <li><a href="/api/metrics">/api/metrics</a> — Prometheus 指标</li>
  </ul>
  <div class="hint">
    <strong>部署完整前端：</strong>将 <code>gateway-web/dist/</code> 产物复制到 <code>gateway-core/ui-dist/</code> 目录，
    或设置环境变量 <code>GATEWAY_WEB_DIR</code> 指向 dist 路径。重启后自动切换到完整控制台。
  </div>
</body>
</html>
